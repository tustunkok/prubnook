{% extends 'runbook/base.html' %}

{% block title %}{% if object %}Edit{% else %}Create{% endif %} Runbook - Prubnook{% endblock %}

{% block content %}
<h1>{% if object %}Edit{% else %}Create{% endif %} Runbook</h1>

<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ object.name|default:'' }}" required>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3">{{ object.description|default:'' }}</textarea>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if object.is_active or not object %}checked{% endif %}>
        <label class="form-check-label" for="is_active">Active</label>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'runbook_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
