{% extends 'runbook/base.html' %}

{% block title %}{% if group_obj %}Edit{% else %}Create{% endif %} Group - Prubnook{% endblock %}

{% block content %}
<h1>{% if group_obj %}Edit{% else %}Create{% endif %} Group</h1>

<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ group_obj.name|default:'' }}" required>
    </div>
    <div class="mb-3">
        <label for="users" class="form-label">Members</label>
        <select class="form-select" id="users" name="users" multiple size="8">
            {% for u in users %}
            <option value="{{ u.pk }}" {% if group_obj and u in group_obj.user_set.all %}selected{% endif %}>{{ u.username }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'group_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
