{% extends 'runbook/base.html' %}

{% block title %}Delete Runbook - Prubnook{% endblock %}

{% block content %}
<h1>Delete Runbook</h1>
<p>Are you sure you want to delete "<strong>{{ object.name }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'runbook_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
