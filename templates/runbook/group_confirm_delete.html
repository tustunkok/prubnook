{% extends 'runbook/base.html' %}

{% block title %}Delete Group - Prubnook{% endblock %}

{% block content %}
<h1>Delete Group</h1>
<p>Are you sure you want to delete group "<strong>{{ group_obj.name }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'group_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
