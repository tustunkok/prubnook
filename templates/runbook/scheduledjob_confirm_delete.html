{% extends 'runbook/base.html' %}

{% block title %}Delete Scheduled Job - Prubnook{% endblock %}

{% block content %}
<h1>Delete Scheduled Job</h1>
<p>Are you sure you want to delete the scheduled job for "<strong>{{ job.runbook.name }}</strong>" ({{ job.cron_expression }})?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'scheduledjob_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
