{% extends 'runbook/base.html' %}

{% block title %}Add SSH Key - Prubnook{% endblock %}

{% block content %}
<h1>Add SSH Key</h1>

<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
    </div>
    <div class="mb-3">
        <label for="private_key" class="form-label">Private Key</label>
        <textarea class="form-control font-monospace" id="private_key" name="private_key" rows="8" required></textarea>
    </div>
    <div class="mb-3">
        <label for="public_key" class="form-label">Public Key (optional)</label>
        <textarea class="form-control font-monospace" id="public_key" name="public_key" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'sshkey_list' %}" class="btn btn-secondary">Cancel</a>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var editor = CodeMirror.fromTextArea(document.getElementById('private_key'), {
            lineNumbers: true,
            lineWrapping: true,
        });
        editor.setSize(null, '300px');
    });
</script>
{% endblock %}
