{% extends 'runbook/base.html' %}

{% block title %}Delete User - Prubnook{% endblock %}

{% block content %}
<h1>Delete User</h1>
<p>Are you sure you want to delete user "<strong>{{ user_obj.username }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
