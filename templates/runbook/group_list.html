{% extends 'runbook/base.html' %}

{% block title %}Groups - Prubnook{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Groups</h1>
    <a href="{% url 'group_create' %}" class="btn btn-primary">Create Group</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Members</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for g in groups %}
        <tr>
            <td>{{ g.name }}</td>
            <td>{{ g.user_set.count }}</td>
            <td>
                <a href="{% url 'group_update' g.pk %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'group_delete' g.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center text-muted">No groups found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
